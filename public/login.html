<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — контур лидов</title>
<style>
  * { box-sizing:border-box; }
  :root { --acc:#2563eb; --acc-hover:#1d4ed8; --text:#0f1720; --dim:#6b7280; --line:#e6e8ec; --line-strong:#d4dae1; }
  body { margin:0; height:100vh; display:grid; place-items:center; color:var(--text);
         background:linear-gradient(160deg,#eef3fb 0%,#e4ecf8 55%,#dde7f6 100%);
         font:14px/1.45 "Inter Variable",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         -webkit-font-smoothing:antialiased; }
  form { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; width:320px;
         box-shadow:0 16px 48px -8px rgba(16,24,40,.16), 0 1px 2px rgba(16,24,40,.05); }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; }
  label { display:block; font-size:12px; color:var(--dim); margin:0 0 4px; }
  input { width:100%; height:40px; margin-bottom:12px; background:#fff; border:1px solid var(--line-strong); color:inherit;
          border-radius:10px; padding:0 12px; font:inherit; box-shadow:0 1px 2px rgba(16,24,40,.04);
          transition:border-color .14s, box-shadow .14s; }
  input:hover { border-color:#b3bec9; }
  input:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(37,99,235,.18); }
  button { width:100%; height:40px; margin-top:4px; background:var(--acc); border:1px solid var(--acc); color:#fff;
           border-radius:10px; font:inherit; font-weight:500; cursor:pointer; box-shadow:0 1px 2px rgba(16,24,40,.05);
           transition:background .14s; }
  button:hover { background:var(--acc-hover); }
  button:active { box-shadow:none; transform:translateY(.5px); }
  .err { color:#dc2626; font-size:12px; min-height:16px; margin-top:10px; }
</style>
</head>
<body>
<form onsubmit="login(event)">
  <h1>Контур лидов</h1>
  <p class="sub">Логин и пароль выдаёт администратор</p>
  <label for="user">Логин</label>
  <input id="user" autocomplete="username" autofocus>
  <label for="password">Пароль</label>
  <input id="password" type="password" autocomplete="current-password">
  <button>Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
async function login(e) {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ user: user.value, password: password.value }),
  });
  if (res.ok) location.href = '/';
  else err.textContent = (await res.json().catch(() => ({}))).error || 'не вышло';
}
</script>
</body>
</html>
