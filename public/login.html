<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — контур лидов</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#e3f5f3; color:#6b5312;
         font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; }
  form { background:#f4fbfa; border:1px solid #c8a53c; border-radius:10px; padding:24px; width:280px;
         box-shadow:0 2px 12px rgba(200,165,60,.15); }
  h1 { font-size:16px; margin:0 0 16px; letter-spacing:.02em; }
  input { width:100%; margin-bottom:10px; background:#fff; border:1px solid #c8a53c; color:inherit;
          border-radius:6px; padding:8px 10px; font:inherit; }
  input::placeholder { color:#9a8544; }
  button { width:100%; background:#c8a53c; border:1px solid #b8952c; color:#3b2c06; padding:9px;
           border-radius:6px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  .err { color:#a8323f; font-size:12px; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
<form onsubmit="login(event)">
  <h1>Контур лидов</h1>
  <input id="user" placeholder="логин" autocomplete="username" autofocus>
  <input id="password" type="password" placeholder="пароль" autocomplete="current-password">
  <button>Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
async function login(e) {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ user: user.value, password: password.value }),
  });
  if (res.ok) location.href = '/';
  else err.textContent = (await res.json().catch(() => ({}))).error || 'не вышло';
}
</script>
</body>
</html>
