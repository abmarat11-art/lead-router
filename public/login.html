<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — контур лидов</title>
<style>
  :root {
    --gold:#D9BE8E; --gold-dark:#BB9A63;
    --gold-fill: linear-gradient(180deg, #F2DFB6 0%, #D9BE8E 52%, #C19F6A 100%);
    --gloss: inset 0 1px 1px rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.15);
  }
  body { margin:0; height:100vh; display:grid; place-items:center; background:#e3f5f3; color:#5E4A22;
         font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; }
  form { background:#f4fbfa; border:1px solid var(--gold); border-radius:10px; padding:24px; width:280px;
         box-shadow:inset 0 1px 1px rgba(255,255,255,.45), 0 2px 12px rgba(94,74,34,.18); }
  h1 { font-size:16px; margin:0 0 16px; letter-spacing:.02em; }
  input { width:100%; margin-bottom:10px; background:#fff; border:1px solid var(--gold); color:inherit;
          border-radius:6px; padding:8px 10px; font:inherit; box-shadow:inset 0 1px 1px rgba(0,0,0,.05); }
  input::placeholder { color:#8E7845; }
  input:focus { outline:2px solid var(--gold); outline-offset:0; }
  button { width:100%; background:var(--gold-fill); border:1px solid var(--gold-dark);
           border-top-color:rgba(255,255,255,.6); color:#3b2c06; padding:9px;
           border-radius:6px; font:inherit; font-weight:600; cursor:pointer;
           box-shadow:var(--gloss); text-shadow:0 1px 0 rgba(255,255,255,.3); }
  button:hover { filter:brightness(1.05); }
  button:active { box-shadow:inset 0 1px 3px rgba(0,0,0,.18); }
  .err { color:#a8323f; font-size:12px; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
<form onsubmit="login(event)">
  <h1>Контур лидов</h1>
  <input id="user" placeholder="логин" autocomplete="username" autofocus>
  <input id="password" type="password" placeholder="пароль" autocomplete="current-password">
  <button>Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
async function login(e) {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ user: user.value, password: password.value }),
  });
  if (res.ok) location.href = '/';
  else err.textContent = (await res.json().catch(() => ({}))).error || 'не вышло';
}
</script>
</body>
</html>
