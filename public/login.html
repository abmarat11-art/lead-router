<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — контур лидов</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center; background:#0f1115; color:#e6e9ef;
         font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; }
  form { background:#171a21; border:1px solid #252a35; border-radius:10px; padding:24px; width:280px; }
  h1 { font-size:16px; margin:0 0 16px; }
  input { width:100%; margin-bottom:10px; background:#0d0f14; border:1px solid #252a35; color:inherit;
          border-radius:6px; padding:8px 10px; font:inherit; }
  button { width:100%; background:#4f8cff; border:0; color:#fff; padding:9px; border-radius:6px; font:inherit; cursor:pointer; }
  .err { color:#f45b69; font-size:12px; min-height:16px; margin-top:8px; }
</style>
</head>
<body>
<form onsubmit="login(event)">
  <h1>Контур лидов</h1>
  <input id="user" placeholder="логин" autocomplete="username" autofocus>
  <input id="password" type="password" placeholder="пароль" autocomplete="current-password">
  <button>Войти</button>
  <div class="err" id="err"></div>
</form>
<script>
async function login(e) {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ user: user.value, password: password.value }),
  });
  if (res.ok) location.href = '/';
  else err.textContent = (await res.json().catch(() => ({}))).error || 'не вышло';
}
</script>
</body>
</html>
