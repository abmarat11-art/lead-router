<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контур распределения лидов</title>
<style>
  :root {
    --bg:#e3f5f3;          /* светлый бирюзовый фон */
    --card:#f4fbfa;        /* карточки чуть светлее фона */
    --line:#c8a53c;        /* золотые рамки и границы */
    --line-soft:#e0cd96;   /* тонкие разделители внутри таблиц */
    --text:#6b5312;        /* тёмное золото: читается на светлом */
    --dim:#9a8544;
    --acc:#c8a53c;         /* золото для кнопок и акцентов */
    --acc-ink:#3b2c06;     /* текст на золотой кнопке */
    --ok:#1f7a5c; --warn:#a9781a; --bad:#a8323f;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:2px solid var(--line);
           position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0 16px 0 0; color:var(--text); letter-spacing:.02em; }
  h3 { margin:20px 0 8px; font-size:14px; color:var(--text); }
  nav button { background:none; border:1px solid transparent; color:var(--dim); padding:6px 10px;
               border-radius:6px; cursor:pointer; font:inherit; }
  nav button:hover { color:var(--text); }
  nav button.on { background:var(--card); color:var(--text); border-color:var(--line); font-weight:600; }
  .spacer { flex:1 }
  button.act { background:var(--acc); border:1px solid var(--line); color:var(--acc-ink); padding:6px 12px;
               border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
  button.ghost { background:var(--card); border:1px solid var(--line); color:var(--text); padding:4px 10px;
                 border-radius:6px; cursor:pointer; font:inherit; }
  button.ghost:hover, button.act:hover { filter:brightness(1.05); }
  main { padding:16px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
          border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  th { color:var(--text); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
       background:#eef8f6; border-bottom:2px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; padding:1px 7px; border-radius:20px; font-size:12px;
         background:#eef8f6; color:var(--dim); border:1px solid var(--line-soft); }
  .tag.new { background:#e2f2f7; color:#1f5f7a; border-color:#a9cfdc }
  .tag.assigned { background:#faf1d8; color:var(--warn); border-color:var(--line) }
  .tag.in_work { background:#e0f2ea; color:var(--ok); border-color:#8fc7b2 }
  .tag.escalated,.tag.quarantine,.tag.rejected { background:#fae7e9; color:var(--bad); border-color:#d99aa2 }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:110px; }
  .card b { display:block; font-size:22px; color:var(--text); }
  .card span { color:var(--dim); font-size:12px; }
  .dim { color:var(--dim); font-size:12px; }
  .chain { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px 10px; }
  .chip.prio { background:var(--acc); color:var(--acc-ink); font-weight:600; }
  select,input { background:#fff; border:1px solid var(--line); color:var(--text); border-radius:6px;
                 padding:4px 8px; font:inherit; }
  input[type=checkbox] { accent-color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>Контур лидов</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" onclick="api('/api/import','POST').then(load)">Опросить таблицу</button>
  <button class="act" onclick="api('/api/dispatch','POST').then(load)">Распределить пул</button>
  <button class="ghost" onclick="api('/api/deliver','POST').then(load)">Отправить в Аргус</button>
  <button class="ghost" onclick="fetch('/api/logout').then(()=>location.href='/login.html')">Выйти</button>
</header>
<main id="view">загрузка…</main>
<script>
const TABS = [['new','Пул'],['assigned','Назначены'],['in_work','В работе'],['rejected','Фрод'],['quarantine','Карантин'],['escalated','Эскалация'],['queues','Очереди'],['teams','Команды']];
const KIND_RU = { lead: 'лид', meeting: 'встреча' };
let tab = 'new', teams = [], queues = [], data = [], st = {};

const api = (url, method = 'GET', body) =>
  fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
    .then(r => { if (r.status === 401) location.href = '/login.html'; return r.json(); });

const esc = (s) => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
const teamName = (id) => teams.find(t => t.id === id)?.name || id;

async function load() {
  [st, teams, queues] = await Promise.all([api('/api/stats'), api('/api/teams'), api('/api/queues')]);
  data = ['teams', 'queues'].includes(tab) ? [] : await api('/api/leads?status=' + tab);
  render();
}

function render() {
  document.getElementById('nav').innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';load()">${t}</button>`).join('');
  document.getElementById('view').innerHTML =
    tab === 'teams' ? renderTeams() : tab === 'queues' ? renderQueues() : renderLeads();
}

const counters = () => `<div class="cards">${
  Object.entries(st.leads || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('')
}</div>`;

function renderLeads() {
  if (!data.length) return counters() + '<p class="dim">Пусто.</p>';
  const opts = teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  return counters() + `<table><tr>
      <th>Компания</th><th>Контакт</th><th>Вид</th><th>Лидген</th><th>Статус</th><th>Команда</th><th></th></tr>` +
    data.map(l => `<tr>
      <td>${esc(l.company)}<div class="dim">${esc(l.source_key)}</div></td>
      <td>${esc(l.contact_name)}<div class="dim">${esc(l.phone || l.email)}</div></td>
      <td>${esc(KIND_RU[l.kind] || l.kind || '—')}</td>
      <td>${esc(l.lead_gen)}</td>
      <td><span class="tag ${l.status}">${l.status}</span>
        ${l.quarantine_reason ? `<div class="dim">${esc(l.quarantine_reason)}</div>` : ''}
        ${l.decline_count ? `<div class="dim">отказов: ${l.decline_count}</div>` : ''}</td>
      <td>${esc(l.team_name || '—')}
        ${l.assignments.length > 1 ? `<div class="dim">${l.assignments.map(a => esc(a.team_name) + ' — ' + a.state).join(', ')}</div>` : ''}</td>
      <td>
        ${l.status === 'quarantine' ? `<button class="ghost" onclick="act(${l.id},'release')">В пул</button>` : ''}
        ${['new','escalated'].includes(l.status) ? `<button class="ghost" onclick="act(${l.id},'assign')">Назначить по очереди</button>` : ''}
        ${l.status === 'assigned' ? `<button class="ghost" onclick="act(${l.id},'in-work')">В работе</button>
          <button class="ghost" onclick="act(${l.id},'decline')">Фрод</button>` : ''}
        <select onchange="assignTo(${l.id}, this.value)"><option value="">команде…</option>${opts}</select>
      </td></tr>`).join('') + '</table>';
}

const act = (id, what) => api(`/api/leads/${id}/${what}`, 'POST').then(load);
const assignTo = (id, team_id) => team_id && api(`/api/leads/${id}/assign`, 'POST', { team_id: +team_id }).then(load);

function renderQueues() {
  return queues.map(q => `<h3>Очередь: ${KIND_RU[q.kind] || q.kind}</h3>
    <div class="chain">${q.preview.map(p =>
      `<span class="chip ${p.via_priority ? 'prio' : ''}">${esc(teamName(p.team_id))}${p.via_priority ? ' ↑' : ''}</span>`).join('<span class="dim">→</span>')}</div>
    <p class="dim">${q.priority.length
      ? 'долг после фрода: ' + q.priority.map(p => esc(p.team_name)).join(', ')
      : 'внеочередников нет, идёт обычный круг'}</p>`).join('');
}

function renderTeams() {
  return `<table><tr><th>Порядок</th><th>Команда</th><th>Ответственный в Аргусе</th><th>Назначено сейчас</th><th>Взяли в работу</th><th>Фрод</th><th>Активна</th></tr>` +
    (st.teams || []).map(t => `<tr>
      <td>${t.queue_order}</td><td>${esc(t.name)}</td>
      <td><input value="${esc(t.argus_user_id || '')}" placeholder="id из Аргуса" style="width:200px"
            onchange="api('/api/teams/${t.id}','PATCH',{argus_user_id:this.value||null}).then(load)">
        ${t.argus_user_id ? '' : '<div class="dim">без него компания не уедет</div>'}</td>
      <td>${t.pending || 0}</td><td>${t.in_work || 0}</td><td>${t.declined || 0}</td>
      <td><input type="checkbox" ${t.active ? 'checked' : ''} onchange="api('/api/teams/${t.id}','PATCH',{active:this.checked?1:0}).then(load)"></td>
    </tr>`).join('') + `</table>
    <h3>Вебхуки в Аргус</h3><div class="cards">${
      Object.entries(st.outbox || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">очередь пуста</span>'
    }</div>
    <h3>Пометки в таблице</h3><div class="cards">${
      Object.entries(st.sheet_writes || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">записей нет</span>'
    }</div>
    <h3>Компании в Аргусе</h3><div class="cards">${
      Object.entries(st.argus || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">пока не отправляли</span>'
    }</div>`;
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
