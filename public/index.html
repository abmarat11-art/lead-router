<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контур распределения лидов</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#252a35; --text:#e6e9ef; --dim:#9aa3b2; --acc:#4f8cff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f45b69; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
  h1 { font-size:16px; margin:0 16px 0 0; }
  nav button { background:none; border:0; color:var(--dim); padding:6px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--card); color:var(--text); }
  .spacer { flex:1 }
  button.act { background:var(--acc); border:0; color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button.ghost { background:var(--card); border:1px solid var(--line); color:var(--text); padding:4px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  main { padding:16px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; padding:1px 7px; border-radius:20px; font-size:12px; background:#232833; color:var(--dim); }
  .tag.new,.tag.queued { background:#1d2b45; color:#8ab4ff }
  .tag.offered { background:#3a2f14; color:var(--warn) }
  .tag.assigned { background:#14321f; color:var(--ok) }
  .tag.escalated,.tag.quarantine { background:#3a1a1f; color:var(--bad) }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; min-width:120px; }
  .card b { display:block; font-size:22px; }
  .card span { color:var(--dim); font-size:12px; }
  .dim { color:var(--dim); font-size:12px; }
  select,input { background:#0d0f14; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 8px; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>Контур лидов</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" onclick="api('/api/import','POST').then(load)">Импорт сейчас</button>
  <button class="act" onclick="api('/api/dispatch','POST').then(load)">Распределить пул</button>
</header>
<main id="view">загрузка…</main>
<script>
const TABS = [['pool','Пул'],['offered','Предложены'],['assigned','В работе'],['quarantine','Карантин'],['escalated','Эскалация'],['teams','Команды'],['monitor','Мониторинг']];
let tab = 'pool', teams = [], data = [], st = {};

const api = (url, method = 'GET', body) =>
  fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) }).then(r => r.json());

const esc = (s) => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));

async function load() {
  st = await api('/api/stats');
  teams = await api('/api/teams');
  if (tab === 'teams' || tab === 'monitor') data = [];
  else {
    const q = tab === 'pool' ? '' : '?status=' + tab;
    data = await api('/api/leads' + q);
    if (tab === 'pool') data = data.filter(l => ['new','queued'].includes(l.status));
  }
  render();
}

function render() {
  document.getElementById('nav').innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';load()">${t}</button>`).join('');
  document.getElementById('view').innerHTML =
    tab === 'teams' ? renderTeams() : tab === 'monitor' ? renderMonitor() : renderLeads();
}

const counters = () => `<div class="cards">${
  Object.entries(st.leads || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('')
}</div>`;

function renderLeads() {
  if (!data.length) return counters() + '<p class="dim">Пусто.</p>';
  const opts = teams.flatMap(t => t.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`)).join('');
  return counters() + `<table><tr>
      <th>Компания</th><th>Контакт</th><th>Язык</th><th>Итог</th><th>Лидген</th><th>Статус</th><th>Кому</th><th></th></tr>` +
    data.map(l => `<tr>
      <td>${esc(l.company)}<div class="dim">${esc(l.source_key)}</div></td>
      <td>${esc(l.contact_name)}<div class="dim">${esc(l.phone || l.email)}</div></td>
      <td>${esc(l.lang)}</td><td>${esc(l.outcome_type)}</td><td>${esc(l.lead_gen)}</td>
      <td><span class="tag ${l.status}">${l.status}</span>${l.quarantine_reason ? `<div class="dim">${esc(l.quarantine_reason)}</div>` : ''}${l.decline_count ? `<div class="dim">отказов: ${l.decline_count}</div>` : ''}</td>
      <td>${l.offer ? esc(l.offer.employee_name) + '<div class="dim">до ' + esc(l.offer.expires_at) + '</div>' : esc(l.assigned_to ? nameOf(l.assigned_to) : '')}</td>
      <td>
        ${l.status === 'quarantine' ? `<button class="ghost" onclick="act(${l.id},'release')">В работу</button>` : ''}
        ${['new','queued','escalated'].includes(l.status) ? `<button class="ghost" onclick="act(${l.id},'offer')">Предложить</button>` : ''}
        <select onchange="assign(${l.id}, this.value)"><option value="">назначить…</option>${opts}</select>
      </td></tr>`).join('') + '</table>';
}

const nameOf = (id) => teams.flatMap(t => t.members).find(m => m.id === id)?.name || id;
const act = (id, what) => api(`/api/leads/${id}/${what}`, 'POST').then(load);
const assign = (id, employee_id) => employee_id && api(`/api/leads/${id}/assign`, 'POST', { employee_id: +employee_id }).then(load);

function renderTeams() {
  return teams.map(t => `<h3>${esc(t.name)} <span class="dim">${t.strategy}</span></h3>
    <table><tr><th>#</th><th>Сотрудник</th><th>Телеграм</th><th>Языки</th><th>Лимит/день</th><th>Активен</th></tr>` +
    t.members.map(m => `<tr><td>${m.queue_order}</td><td>${esc(m.name)}</td>
      <td>${esc(m.tg_username || '—')}${m.tg_user_id ? '' : '<div class="dim">не привязан</div>'}</td>
      <td>${m.langs.join(', ') || '—'}</td><td>${m.daily_limit || '∞'}</td>
      <td><input type="checkbox" ${m.active ? 'checked' : ''} onchange="api('/api/employees/${m.id}','PATCH',{active:this.checked?1:0}).then(load)"></td>
    </tr>`).join('') + '</table>').join('') || '<p class="dim">Команд пока нет.</p>';
}

function renderMonitor() {
  return counters() + `<table><tr><th>Сотрудник</th><th>Принял</th><th>Отказал</th><th>Просрочил</th><th>Ждёт ответа</th></tr>` +
    (st.employees || []).map(e => `<tr><td>${esc(e.name)}</td><td>${e.accepted || 0}</td><td>${e.declined || 0}</td>
      <td>${e.expired || 0}</td><td>${e.pending || 0}</td></tr>`).join('') +
    `</table><h3>Вебхуки в Аргус</h3><div class="cards">${
      Object.entries(st.outbox || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">очередь пуста</span>'
    }</div>`;
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
