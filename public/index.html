<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контур распределения лидов</title>
<link rel="stylesheet" href="/app.css?v=3">
</head>
<body>
<header>
  <h1>Контур лидов</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="btn-import" onclick="run(this,'/api/import','Читаю таблицу')"
          title="Прочитать гуглтаблицу прямо сейчас, не дожидаясь ежеминутного опроса">Прочитать таблицу</button>
  <button class="act" id="btn-dispatch" onclick="run(this,'/api/dispatch','Раздаю пул')"
          title="Раздать командам всё, что лежит в пуле нераспределённым">Раздать по очереди</button>
  <button class="ghost" id="btn-deliver" onclick="run(this,'/api/deliver','Отправляю в Аргус')"
          title="Завести в Аргусе компании по уже назначенным строкам">Отправить в Аргус</button>
  <button class="ghost" onclick="fetch('/api/logout').then(()=>location.href='/login.html')">Выйти</button>
</header>
<div id="toast"></div>
<div id="modal" onclick="if(event.target.id==='modal') closeTeam()"><div class="box" id="modal-box"></div></div>
<main id="view">загрузка…</main>
<script>
const TABS = [['new','Пул'],['assigned','Назначены'],['in_work','В работе'],['rejected','Фрод'],['quarantine','Карантин'],['escalated','Эскалация'],['queues','Очереди'],['teams','Команды']];
const KIND_RU = { lead: 'лид', meeting: 'встреча' };
let tab = 'new', teams = [], queues = [], data = [], st = {};

const api = (url, method = 'GET', body) =>
  fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) })
    .then(r => { if (r.status === 401) location.href = '/login.html'; return r.json(); });

const esc = (s) => String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));

function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = kind;
  el.textContent = text;
  document.getElementById('toast').append(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 9000 : 4000);
}

// Любое действие кнопки: блокируем на время запроса и показываем, чем кончилось.
async function run(button, url, busyText) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = busyText + '…';
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' } });
    if (res.status === 401) return location.href = '/login.html';
    const data = await res.json().catch(() => ({}));
    if (data.error) toast(data.error, 'bad');
    else toast(describe(url, data), 'ok');
    await load();
  } catch (err) {
    toast('не получилось: ' + err.message, 'bad');
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

const plural = (n, one, few, many) => {
  const d = n % 10, h = n % 100;
  return `${n} ${d === 1 && h !== 11 ? one : d >= 2 && d <= 4 && (h < 12 || h > 14) ? few : many}`;
};

function describe(url, d) {
  if (url.endsWith('/import')) {
    if (!d.seen) return 'В таблице новых строк нет';
    return `Прочитано ${plural(d.seen, 'строка', 'строки', 'строк')}: новых ${d.created}, `
      + `в карантин ${d.quarantined}, раздано ${d.assigned ?? 0}`;
  }
  if (url.endsWith('/dispatch')) {
    return d.seen ? `Раздано ${plural(d.assigned, 'компания', 'компании', 'компаний')}` : 'Пул пуст, раздавать нечего';
  }
  if (url.endsWith('/deliver')) {
    if (!d.picked) return 'Нечего отправлять: все назначенные уже в Аргусе';
    return `В Аргус ушло ${d.sent}, не получилось ${d.failed}`;
  }
  return 'Готово';
}
const teamName = (id) => teams.find(t => t.id === id)?.name || id;

// время в базе — UTC без зоны; показываем по-местному
const when = (iso) => {
  if (!iso) return '<span class="dim">—</span>';
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  return `${d.toLocaleDateString('ru-RU')}<div class="dim">${d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</div>`;
};

const age = (hours) => {
  if (hours === null || hours === undefined) return '';
  if (hours < 1) return 'только что';
  if (hours < 24) return `висит ${Math.round(hours)} ч`;
  return `висит ${Math.floor(hours / 24)} дн`;
};

async function load() {
  [st, teams, queues] = await Promise.all([api('/api/stats'), api('/api/teams'), api('/api/queues')]);
  data = ['teams', 'queues'].includes(tab) ? [] : await api('/api/leads?status=' + tab);
  render();
}

function render() {
  // кнопка без настроенного доступа только злит: гасим и объясняем
  const cfg = st.config || {};
  toggle('btn-import', cfg.sheets, 'Таблица не подключена: нет ключа сервис-аккаунта Google');
  toggle('btn-deliver', cfg.argus, 'Аргус не подключён: не задан ARGUS_API_URL');

  document.getElementById('nav').innerHTML = TABS.map(([k, t]) =>
    `<button class="${k === tab ? 'on' : ''}" onclick="tab='${k}';load()">${t}</button>`).join('');
  document.getElementById('view').innerHTML =
    tab === 'teams' ? renderTeams() : tab === 'queues' ? renderQueues() : renderLeads();
}

function toggle(id, enabled, why) {
  const b = document.getElementById(id);
  if (!b) return;
  b.disabled = !enabled;
  if (!enabled) b.title = why;
}

const counters = () => `<div class="cards">${
  Object.entries(st.leads || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('')
}</div>`;

function renderLeads() {
  if (!data.length) return counters() + '<p class="dim">Пусто.</p>';
  const opts = teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
  return counters() + `<table><tr>
      <th>Компания</th><th>Контакт</th><th>Вид</th><th>Лидген</th><th>Статус</th>
      <th>Назначено</th><th>Статус изменён</th><th>Команда</th><th></th></tr>` +
    data.map(l => `<tr>
      <td>${esc(l.company)}<div class="dim">${esc(l.source_key)}</div></td>
      <td>${esc(l.contact_name)}<div class="dim">${esc(l.phone || l.email)}</div></td>
      <td>${esc(KIND_RU[l.kind] || l.kind || '—')}</td>
      <td>${esc(l.lead_gen)}</td>
      <td><span class="tag ${l.status}">${l.status}</span>
        ${l.quarantine_reason ? `<div class="dim">${esc(l.quarantine_reason)}</div>` : ''}
        ${l.decline_count ? `<div class="dim">отказов: ${l.decline_count}</div>` : ''}</td>
      <td>${when(l.assigned_at)}</td>
      <td>${when(l.status_changed_at)}<div class="${l.age_hours > 24 ? 'stale' : 'dim'}">${age(l.age_hours)}</div></td>
      <td>${esc(l.team_name || '—')}
        ${l.assignments.length > 1 ? `<div class="dim">${l.assignments.map(a => esc(a.team_name) + ' — ' + a.state).join(', ')}</div>` : ''}</td>
      <td>
        ${l.status === 'quarantine' ? `<button class="ghost" onclick="act(${l.id},'release')">В пул</button>` : ''}
        ${['new','escalated'].includes(l.status) ? `<button class="ghost" onclick="act(${l.id},'assign')">Назначить по очереди</button>` : ''}
        ${l.status === 'assigned' ? `<button class="ghost" onclick="act(${l.id},'in-work')">В работе</button>
          <button class="ghost" onclick="act(${l.id},'decline')">Фрод</button>` : ''}
        <select onchange="assignTo(${l.id}, this.value)"><option value="">команде…</option>${opts}</select>
      </td></tr>`).join('') + '</table>';
}

const act = (id, what) => api(`/api/leads/${id}/${what}`, 'POST').then(load);
const assignTo = (id, team_id) => team_id && api(`/api/leads/${id}/assign`, 'POST', { team_id: +team_id }).then(load);

function renderQueues() {
  return queues.map(q => `<h3>Очередь: ${KIND_RU[q.kind] || q.kind}</h3>
    <div class="chain">${q.preview.map(p =>
      `<span class="chip ${p.via_priority ? 'prio' : ''}">${esc(teamName(p.team_id))}${p.via_priority ? ' ↑' : ''}</span>`).join('<span class="dim">→</span>')}</div>
    <p class="dim">${q.priority.length
      ? 'долг после фрода: ' + q.priority.map(p => esc(p.team_name)).join(', ')
      : 'внеочередников нет, идёт обычный круг'}</p>`).join('');
}

function renderTeams() {
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  return `<table><tr><th>Порядок</th><th>Команда</th><th>Состав</th><th>Назначено сейчас</th><th>Взяли в работу</th><th>Фрод</th><th>Активна</th></tr>` +
    (st.teams || []).map(t => {
      const members = byId[t.id]?.members || [];
      const main = members.find(m => m.role === 'assignee' && m.active);
      return `<tr>
      <td>${t.queue_order}</td>
      <td><button class="ghost" onclick="openTeam(${t.id})">${esc(t.name)}</button></td>
      <td>${main
          ? `<span class="badge-main">${esc(main.name || main.argus_user_id)}</span>`
          : '<span class="dim">получатель не выбран — компании не уедут</span>'}
        <div class="dim">всего в команде: ${members.length}</div></td>
      <td>${t.pending || 0}</td><td>${t.in_work || 0}</td><td>${t.declined || 0}</td>
      <td><input type="checkbox" ${t.active ? 'checked' : ''} onchange="api('/api/teams/${t.id}','PATCH',{active:this.checked?1:0}).then(load)"></td>
    </tr>`;
    }).join('') + `</table>
    <h3>Вебхуки в Аргус</h3><div class="cards">${
      Object.entries(st.outbox || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">очередь пуста</span>'
    }</div>
    <h3>Пометки в таблице</h3><div class="cards">${
      Object.entries(st.sheet_writes || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">записей нет</span>'
    }</div>
    <h3>Компании в Аргусе</h3><div class="cards">${
      Object.entries(st.argus || {}).map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('') || '<span class="dim">пока не отправляли</span>'
    }</div>`;
}

// ---- карточка команды: состав и история ----
let openTeamId = null, teamTab = 'members';

async function openTeam(id) {
  openTeamId = id;
  teamTab = 'members';
  await renderTeam();
  document.getElementById('modal').classList.add('on');
}

function closeTeam() {
  document.getElementById('modal').classList.remove('on');
  openTeamId = null;
  load();
}

async function renderTeam() {
  const team = teams.find(t => t.id === openTeamId) || {};
  const [members, history] = await Promise.all([
    api(`/api/teams/${openTeamId}/members`),
    api(`/api/teams/${openTeamId}/history`),
  ]);

  const body = teamTab === 'members' ? membersTable(members) : historyTable(history);
  document.getElementById('modal-box').innerHTML = `
    <button class="ghost close" onclick="closeTeam()">Закрыть</button>
    <h2>${esc(team.name || 'Команда')}</h2>
    <div class="dim">место в очереди: ${team.queue_order ?? '—'}</div>
    <div class="subtabs">
      <button class="${teamTab === 'members' ? 'act' : 'ghost'}" onclick="teamTab='members';renderTeam()">Состав</button>
      <button class="${teamTab === 'history' ? 'act' : 'ghost'}" onclick="teamTab='history';renderTeam()">История изменений</button>
    </div>
    ${body}`;
}

function membersTable(members) {
  return `<table><tr><th>Имя</th><th>ID в Аргусе</th><th>Назначать сюда</th><th>Активен</th><th></th></tr>` +
    members.map(m => `<tr>
      <td><input value="${esc(m.name || '')}" placeholder="имя"
            onchange="patchMember(${m.id},{name:this.value||null})" style="width:150px"></td>
      <td><input value="${esc(m.argus_user_id)}"
            onchange="patchMember(${m.id},{argus_user_id:this.value})" style="width:220px"></td>
      <td><input type="radio" name="assignee" ${m.role === 'assignee' ? 'checked' : ''}
            onchange="patchMember(${m.id},{role:'assignee'})"
            title="компания заводится в Аргусе на этого человека"></td>
      <td><input type="checkbox" ${m.active ? 'checked' : ''}
            onchange="patchMember(${m.id},{active:this.checked?1:0})"></td>
      <td><button class="ghost" onclick="dropMember(${m.id})">Убрать</button></td>
    </tr>`).join('') +
    `</table>
     <h3>Добавить человека</h3>
     <div class="row-actions">
       <input id="m-name" placeholder="имя">
       <input id="m-id" placeholder="id пользователя в Аргусе" style="width:260px">
       <button class="act" onclick="createMember()">Добавить</button>
     </div>
     <p class="dim">Назначение уходит на отмеченного точкой. Остальные получают уведомления;
        отметить «принять» или «фрод» может любой из них.</p>`;
}

const HISTORY_RU = {
  member_added: 'добавлен участник', member_removed: 'участник убран',
  member_changed: 'участник изменён', assignee_replaced: 'сменился получатель',
  team_changed: 'команда изменена', team_created: 'команда создана',
};

function historyTable(history) {
  if (!history.length) return '<p class="dim">Изменений пока не было.</p>';
  return `<table><tr><th>Когда</th><th>Что</th><th>Подробности</th></tr>` +
    history.map(h => `<tr>
      <td>${when(h.created_at)}</td>
      <td>${HISTORY_RU[h.kind] || esc(h.kind)}</td>
      <td class="dim">${esc(JSON.stringify(JSON.parse(h.data)))}</td>
    </tr>`).join('') + '</table>';
}

const patchMember = (id, patch) =>
  api(`/api/teams/${openTeamId}/members/${id}`, 'PATCH', patch).then(renderTeam);

const dropMember = (id) =>
  fetch(`/api/teams/${openTeamId}/members/${id}`, { method: 'DELETE' }).then(renderTeam);

async function createMember() {
  const argus_user_id = document.getElementById('m-id').value.trim();
  if (!argus_user_id) return toast('нужен id пользователя в Аргусе', 'bad');
  const res = await api(`/api/teams/${openTeamId}/members`, 'POST', {
    argus_user_id, name: document.getElementById('m-name').value.trim() || null,
  });
  if (res.error) return toast(res.error, 'bad');
  renderTeam();
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
